version: '3.8'

services:
  # ==============================================================================
  # 1. PostgreSQL Relational Data Warehouse
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: telco_churn_postgres
    restart: always
    environment:
      POSTGRES_DB: customer_churn_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/02_create_table.sql:/docker-entrypoint-initdb.d/01_create_table.sql
      - ./sql/04_churn_and_ltv_views.sql:/docker-entrypoint-initdb.d/02_views.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customer_churn_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # 2. FastAPI Machine Learning & LTV Prediction Engine
  # ==============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telco_churn_api
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/customer_churn_db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # ==============================================================================
  # 3. Metabase / Superset Business Intelligence Dashboard Server
  # ==============================================================================
  metabase:
    image: metabase/metabase:latest
    container_name: telco_churn_metabase
    restart: always
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  metabase_data:
